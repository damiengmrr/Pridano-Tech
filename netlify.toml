# Pridano Tech — déploiement Netlify
# Build statique (public/) + fonctions serverless (netlify/functions/) pour le contact et le brief guidé.

[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_ENV = "production"
  PUBLIC_SITE_URL = "https://pridanotech.fr"
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- API (inchangées) ----------
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
